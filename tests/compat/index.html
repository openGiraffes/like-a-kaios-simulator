<!doctype html><html><head><meta charset="utf-8"><title>Compatibility lab</title>
<style>body{margin:0;background:#f4f5fa;color:#28324a;font:13px Arial;padding:16px}h1{font-size:21px;margin:12px 0}p{color:#69748a;font-size:12px;line-height:1.6}#result{white-space:pre-wrap;background:white;border-radius:8px;padding:12px;font-size:11px;line-height:1.6}input{width:90%;padding:8px;border:1px solid #ddd;border-radius:5px}</style></head><body><small>GECKO 45 / API LAB</small><h1>兼容性验证</h1><p>真实浏览器、真实宿主桥接。</p><input placeholder="测试键盘输入"><pre id="result">测试中…</pre><script>
(function(){
  var results=[], output=document.getElementById('result');
  function check(name, ok, detail){results.push({name:name,ok:!!ok,detail:detail||''});output.textContent=results.filter(function(r){return r.ok;}).length+' / '+results.length+' passed\n'+name;}
  function request(r){return new Promise(function(resolve,reject){r.onsuccess=function(){resolve(r.result);};r.onerror=function(){reject(r.error);};});}
  function timeout(p, name){return Promise.race([p,new Promise(function(_,reject){setTimeout(function(){reject(new Error(name+' timed out'));},8000);})]);}
  check('polyfill before app scripts',window.__kaiosGeckoReady===true);
  var names=['serviceWorker','mozApps','mozSettings','mozAlarms','mozNotification','mozTCPSocket','mozUDPSocket','volumeManager','mozAudioChannelManager','b2g','mozCameras','mozBluetooth','mozMobileConnection','mozTelephony','mozContacts','mozPower','mozFMRadio','mozNfc','mozIccManager','mozSetMessageHandler','getDeviceStorage','mozL10n'];
  names.forEach(function(n){check('navigator.'+n,typeof navigator[n]!=='undefined');});
  ['MozActivity','WebActivity','getKaiAd','AppsManager','SettingsObserver','asyncStorage','DeviceCapabilityManager','AppOrigin','deviceInfos','MozBlobBuilder','mozRequestAnimationFrame','mozAudioContext'].forEach(function(n){check(n,typeof window[n]!=='undefined');});
  check('generation detection',typeof navigator.getDeviceStorages===(window.__kaiosMode.mode==='legacy'?'function':'undefined'));
  var keyCount=0; function onKey(e){if(e.key==='#')keyCount++;}window.addEventListener('keydown',onKey);window.__kaiosTap('#');check('one keydown per tap',keyCount===1,keyCount);window.removeEventListener('keydown',onKey);
  var startStorage=navigator.b2g.getDeviceStorage('sdcard');
  navigator.serviceWorker.ready.then(function(registration){check('serviceWorker passive registration',registration.passive===true&&typeof registration.pushManager.getSubscription==='function');return request(navigator.mozSettings.createLock().set({'smoke.value':42}));}).then(function(){return request(navigator.mozSettings.createLock().get('smoke.value'));}).then(function(v){
    check('settings round trip',v['smoke.value']===42);
    return request(startStorage.addNamed(new Blob(['hello Gecko 45']), 'checks/roundtrip.txt'));
  }).then(function(){return request(startStorage.get('checks/roundtrip.txt'));}).then(function(file){return file.text();}).then(function(text){
    check('SD card file round trip',text==='hello Gecko 45');
    return request(navigator.mozSettings.createLock().get(['smoke.tcp','smoke.udp','smoke.frame']));
  }).then(function(ports){
    return timeout(new Promise(function(resolve,reject){var received=[],s=navigator.mozTCPSocket.open('127.0.0.1',ports['smoke.tcp'],{binaryType:'arraybuffer'});s.send(new Uint8Array([0,127]));s.send(new Uint8Array([128,255]));s.onerror=function(e){reject(new Error('TCP '+e.name));};s.ondata=function(e){received=received.concat(Array.prototype.slice.call(new Uint8Array(e.data)));if(received.length<4)return;var b=received;check('TCP queued ordered binary echo',b.length===4&&b[0]===0&&b[1]===127&&b[2]===128&&b[3]===255);s.close();resolve(ports);};}), 'TCP');
  }).then(function(ports){
    return timeout(new Promise(function(resolve,reject){var s=navigator.mozUDPSocket.create({binaryType:'arraybuffer'});s.onbound=function(){s.send(new Uint8Array([7,0,255]),'127.0.0.1',ports['smoke.udp']);};s.onerror=function(e){reject(new Error('UDP '+e.error));};s.onmessage=function(e){var b=new Uint8Array(e.data);check('UDP binary echo',b.length===3&&b[2]===255);s.close();resolve(ports);};}), 'UDP');
  }).then(function(ports){
    return timeout(new Promise(function(resolve){var iframe=document.createElement('iframe');iframe.style.position='absolute';iframe.style.left='-1000px';function listener(e){if(e.data&&e.data.smokeFrame){check('remote iframe early bootstrap',e.data.ready);iframe.contentWindow.postMessage('ping',e.origin);}else if(e.data&&e.data.smokeReply){check('remote iframe virtual parent origin',e.data.origin==='http://compat-lab.localhost',e.data.origin);iframe.focus();console.log('SMOKE_FRAME_KEY');}else if(e.data&&e.data.smokeKey){window.removeEventListener('message',listener);check('native keypad reaches focused remote iframe',true);iframe.parentNode.removeChild(iframe);resolve();}}window.addEventListener('message',listener);iframe.src='http://127.0.0.1:'+ports['smoke.frame']+'/frame.html';document.body.appendChild(iframe);}), 'remote iframe');
  }).then(function(){return timeout(new Promise(function(resolve,reject){var xhr=new XMLHttpRequest();xhr.open('GET','http://shared.localhost/resources/languages.json');xhr.onload=function(){check('shared resource redirect',xhr.status===200&&xhr.responseText.indexOf('en-US')>=0);resolve();};xhr.onerror=function(){reject(new Error('Shared resources failed'));};xhr.send();}), 'shared resources');
  }).then(function(){return timeout(new Promise(function(resolve,reject){var script=document.createElement('script');script.src='https://static.kaiads.com/ads-sdk.min.js';script.onload=function(){check('KaiAds SDK redirect',window.getKaiAd.dummy===true&&typeof window.ads.showAds==='function');resolve();};script.onerror=function(){reject(new Error('Ads SDK failed'));};document.head.appendChild(script);}), 'KaiAds');
  }).then(function(){return timeout(new Promise(function(resolve){var n=navigator.mozNotification.createNotification('Gecko 45','Legacy notification',null,'smoke-legacy');n.onclick=function(){check('legacy notification callback',true);n.close();resolve();};n.show();}), 'legacy notification');
  }).then(function(){return timeout(new Promise(function(resolve){var n=new Notification('Gecko 45',{body:'Standard notification',tag:'smoke-standard'});n.onclick=function(){check('standard notification callback',true);n.close();resolve();};}), 'standard notification');
  }).then(function(){return request(navigator.mozApps.getSelf());}).then(function(self){check('app identity',self&&self.manifest.name==='Gecko compatibility lab');return new MozActivity({name:'not-supported-test'}).start().then(function(){check('unknown activity fails',false);},function(error){check('unknown activity fails',error&&error.name==='NO_PROVIDER',String(error&&error.message||error));});}).catch(function(error){check('unexpected error',false,String(error)+' '+String(error&&error.stack||''));}).then(function(){
    var passed=results.every(function(r){return r.ok;});output.textContent=(passed?'PASS':'FAIL')+' '+results.filter(function(r){return r.ok;}).length+'/'+results.length+'\n\n'+results.filter(function(r){return !r.ok;}).map(function(r){return r.name+': '+r.detail;}).join('\n');
    window.__smokeResult={ok:passed,results:results};console.log('SMOKE_RESULT:'+JSON.stringify(window.__smokeResult));
  });
})();
</script></body></html>
